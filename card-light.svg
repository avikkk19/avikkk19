<style>
  text { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; white-space: pre; }
  .eye { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
  .fire { opacity: 0; animation: fire 6s 1.2s infinite; }
  @keyframes fire { 0%, 4% { opacity: 0; } 8%, 22% { opacity: 1; } 30%, 100% { opacity: 0; } }
  .dragon { animation: bob 6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .ln { animation: show 0.35s ease-out both; }
  @keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .cursor { animation: caret 1.1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .eye, .fire, .dragon, .ln, .cursor { animation: none; } }
</style>
